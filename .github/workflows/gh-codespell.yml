name: Codespell

on:
  pull_request:
    branches:
      - master

jobs:
  codespell:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check spelling
        uses: codespell-project/actions-codespell@v2
        with:
          path: source
          exclude_file: ${{ github.workspace }}/source/conf.py
          skip: '*.svg,*.py'

