name: Deploy Simplified Chinese documentation to Pages

on:
  push:
    branches:
      - master

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and deploy documentation
        id: deployment
        uses: sphinx-notes/pages@v3
        with:
          documentation_path: ./source
          requirements_path: requirements.txt
          sphinx_build_options: -D language=zh_CN
          cache: true
          publish: true